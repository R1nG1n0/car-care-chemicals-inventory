<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- garage — вариант для iOS и maskable: сплошной фон без прозрачности и без своих
       скруглений (их делает система), бутылка целиком в безопасной зоне (центральные 80 %) -->
  <defs>
    <clipPath id="b">
      <path d="M206 170H286V200L330 236V368A24 24 0 0 1 306 392H186A24 24 0 0 1 162 368V236L206 200Z"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" fill="#D4B26A"/>
  <g transform="translate(256 256) scale(1.04) translate(-257 -265)">
    <!-- жёсткая тень бутылки: тот же силуэт со сдвигом, без размытия -->
    <g transform="translate(22 22)" fill="#1C1B20">
      <path d="M206 170H286V200L330 236V368A24 24 0 0 1 306 392H186A24 24 0 0 1 162 368V236L206 200Z" stroke="#1C1B20" stroke-width="20" stroke-linejoin="round"/>
      <rect x="196" y="116" width="100" height="54" rx="10"/>
    </g>
    <!-- корпус, жидкость (уровень остатка), контур, крышка -->
    <path d="M206 170H286V200L330 236V368A24 24 0 0 1 306 392H186A24 24 0 0 1 162 368V236L206 200Z" fill="#EDE6D6"/>
    <rect x="150" y="286" width="192" height="120" fill="#566F38" clip-path="url(#b)"/>
    <path d="M162 286H330" stroke="#1C1B20" stroke-width="12"/>
    <path d="M206 170H286V200L330 236V368A24 24 0 0 1 306 392H186A24 24 0 0 1 162 368V236L206 200Z" fill="none" stroke="#1C1B20" stroke-width="20" stroke-linejoin="round"/>
    <rect x="196" y="116" width="100" height="54" rx="10" fill="#1C1B20"/>
  </g>
</svg>

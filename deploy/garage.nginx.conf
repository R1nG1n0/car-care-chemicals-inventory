# garage.north-flow.online — только внутри VPN (ТЗ Р5.2, Р5.5).
# Сертификат *.north-flow.online — тот же, что у панели (north-flow.conf).
server {
    listen 10.211.7.1:443 ssl http2;
    server_name garage.north-flow.online;
    ssl_certificate     /var/lib/lego/certificates/_.north-flow.online.crt;
    ssl_certificate_key /var/lib/lego/certificates/_.north-flow.online.key;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;

    # Сжатие статики интерфейса (в nginx.conf сжимается только text/html).
    # Ответы API (JSON) не сжимаются — так исключён класс атак BREACH.
    gzip_types text/css text/javascript application/javascript application/wasm image/svg+xml application/manifest+json;
    gzip_vary on;

    # Импорт данных (ФТ-10.3): файл до 100 МБ (равно importMaxBody), медленная
    # мобильная сеть. Тело не буферизуется на диск: сервер читает его потоком,
    # а срок чтения у него 10 минут (transferReadTimeout).
    location = /api/import {
        client_max_body_size 100m;
        client_body_timeout 120s;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
